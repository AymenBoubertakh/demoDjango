name: Django CI and Deploy to Render

on:
  push:
    branches: [ master ] # Trigger workflow on every push to master
  pull_request:
    branches: [ master ] # Trigger workflow for pull requests to master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest # Use an Ubuntu virtual machine
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      # Step 1: Checkout the repository
      - uses: actions/checkout@v3
      
      # Step 2: Set up Python 3.12
      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      # Step 4: Run tests
      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
        run: |
          python manage.py makemigrations
          python manage.py migrate
          python manage.py test
      
      # Step 5: Build Docker image from Dockerfile
      - name: Build Docker image
        run: docker build -t django-backend .
      
      # ******* Continuous Deployment *******
      # Step 6: Deploy to Render
      - name: Deploy to production
        uses: johnbeynon/render-deploy-action@v0.0.8
        with:
          service-id: ${{ secrets.BACKEND2_SERVICE_ID }}
          api-key: ${{ secrets.RENDER_API_KEY }}
